[package]
name = "unison-wasm-host"
version = "0.1.0"
edition = "2021"
description = "Capability-restricted WebAssembly notification plugin host for Unison"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "27"
wasmtime-wasi = "27"

[dev-dependencies]
wat = "1"
